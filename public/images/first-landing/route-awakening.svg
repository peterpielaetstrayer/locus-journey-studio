      <stop offset="0%" stop-color="#1e2e28"/>
      <stop offset="50%" stop-color="#2a4038"/>
      <stop offset="100%" stop-color="#152018"/>
    </linearGradient>
    <radialGradient id="fog" cx="70%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4a6058" stop-opacity="0.6"/>
