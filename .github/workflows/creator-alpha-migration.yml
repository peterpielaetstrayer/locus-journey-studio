name: Creator alpha migration package check

on:
  pull_request:
    branches:
      - design/creator-only-supabase-schema-2026-10-11
    paths:
      - ".github/workflows/creator-alpha-migration.yml"
      - "supabase/**"
      - "docs/database/**"
      - "src/types/database.types.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Discover CLI command
        run: |
          supabase --version
          supabase migration --help
          supabase migration new --help
      - name: Generate a migration filename using the CLI (no hosted database)
        run: |
          supabase migration new creator_alpha_initial
          echo "CLI_GENERATED_MIGRATION=$(find supabase/migrations -maxdepth 1 -name '*_creator_alpha_initial.sql' -printf '%f\\n' | head -1)"
          ls -la supabase/migrations/
