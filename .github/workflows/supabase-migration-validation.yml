name: Supabase Migration Validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/lib/repositories/**"
      - "src/lib/creator-beta/**"
      - "docs/preview/**"
      - ".github/workflows/supabase-migration-validation.yml"
      - "src/lib/auth/**"
      - "src/app/api/**"
      - "src/types/database.types.ts"
      - "scripts/test-creator-alpha-auth.mjs"
      - "scripts/test-creator-alpha-browser.mjs"
      - "docs/database/creator-alpha-first-adult-onboarding.md"
  workflow_dispatch:

concurrency:
  group: supabase-migration-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Isolated Supabase + app validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Cache Supabase Docker images
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-docker-${{ hashFiles('supabase/config.toml') }}
          restore-keys: |
            supabase-docker-

      - name: Start isolated local Supabase (Docker)
        run: supabase start 2>&1 | tee supabase-start.log

      - name: Reset local database (migrations + seed)
        run: supabase db reset --local 2>&1 | tee supabase-db-reset.log

      - name: Exercise real local Supabase Auth and Data API RLS (synthetic adults)
        shell: bash
        run: |
          set -euo pipefail
          # Obtain temporary LOCAL stack keys only. Never print or upload them.
          supabase status --help >/dev/null
          umask 077
          envfile="$(mktemp)"
          trap 'rm -f "$envfile"' EXIT
          supabase status -o env > "$envfile"
          set -a
          source "$envfile"
          set +a
          node scripts/test-creator-alpha-auth.mjs

      - name: Run pgTAP RLS tests (48 assertions)
        run: supabase test db 2>&1 | tee supabase-test-db.log

      - name: Lint local database schema
        run: supabase db lint --local --fail-on error 2>&1 | tee supabase-db-lint.log

      - name: Application unit tests
        run: npm run test 2>&1 | tee npm-test.log

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee npm-typecheck.log

      - name: ESLint
        run: npm run lint 2>&1 | tee npm-lint.log

      - name: Production build
        run: npm run build 2>&1 | tee npm-build.log
        env:
          # Demo mode build — no hosted Supabase credentials in CI
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""

      - name: Install pinned ephemeral Playwright Chromium test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser acceptance through real local Supabase and Next.js
        shell: bash
        run: |
          set -euo pipefail
          # Safety: ONLY local Supabase (port 54321) and local Next.js (port 3000).
          umask 077
          envfile="$(mktemp)"
          trap 'kill "${next_pid:-}" 2>/dev/null || true; rm -f "$envfile"' EXIT
          supabase status -o env > "$envfile"
          set -a
          source "$envfile"
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export CREATOR_ALPHA_BROWSER_URL="http://127.0.0.1:3000"
          npm run dev -- --hostname 127.0.0.1 --port 3000 > browser-next.log 2>&1 &
          next_pid=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$next_pid" 2>/dev/null; then
              tail -60 browser-next.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local Next.js login page did not become ready"
            tail -60 browser-next.log
            exit 1
          fi
          node scripts/test-creator-alpha-browser.mjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-validation-logs-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            supabase-start.log
            supabase-db-reset.log
            supabase-test-db.log
            supabase-db-lint.log
            npm-test.log
            npm-typecheck.log
            npm-lint.log
            npm-build.log
            browser-next.log
            supabase/.temp/**

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup 2>&1 | tee supabase-stop.log || true
